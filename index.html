<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02040a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Мой план" />
    <title>Мой план</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Print first, then all: a slow font server must not hold back the loading screen. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet" media="print" onload="this.media = 'all'" />
    <script>
      // Theme before first paint, so the page never flashes the wrong colours.
      (function () {
        var t;
        try { t = localStorage.getItem('app_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      /* The loading screen lives here so it shows at once, before any of the site has arrived. */
      html, body { margin: 0; height: 100%; }
      html[data-theme='dark'] {
        background: #02040a;
        --sp-bg: #02040a;
        --sp-video: grayscale(1) brightness(0.72) contrast(1.35) blur(1.5px);
        --sp-tint: linear-gradient(170deg, #2f74ea 0%, #174aba 55%, #0d3290 100%);
        --sp-shade: radial-gradient(90% 70% at 50% 46%, rgba(2, 4, 10, 0.3) 0%, rgba(2, 4, 10, 0.68) 100%);
        --sp-ink: #fff;
        --sp-ink-2: rgba(205, 225, 255, 0.72);
        --sp-empty: rgba(170, 205, 255, 0.16);
        --sp-line: rgba(200, 225, 255, 0.5);
        --sp-liquid-a: #a9d4ff;
        --sp-liquid-b: #eaf4ff;
        --sp-shine: rgba(60, 130, 240, 0.8);
      }
      html[data-theme='light'] {
        background: #ecf3fc;
        --sp-bg: #ecf3fc;
        --sp-video: grayscale(1) brightness(1.18) contrast(1.05) blur(1.5px);
        --sp-tint: linear-gradient(170deg, #84adff 0%, #a4c4ff 55%, #c2d9ff 100%);
        --sp-shade: radial-gradient(90% 70% at 50% 46%, rgba(236, 243, 252, 0.62) 0%, rgba(236, 243, 252, 0.2) 100%);
        --sp-ink: #06183c;
        --sp-ink-2: rgba(6, 30, 80, 0.68);
        --sp-empty: rgba(20, 80, 200, 0.12);
        --sp-line: rgba(20, 90, 220, 0.42);
        --sp-liquid-a: #39a0ff;
        --sp-liquid-b: #1049e0;
        --sp-shine: rgba(255, 255, 255, 0.85);
      }
      #splash {
        position: fixed;
        z-index: 1000;
        inset: 0;
        overflow: hidden;
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .sp-world {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--sp-bg);
        transition: opacity 0.5s ease-out;
      }
      /*
       * The owner's video: grey by itself, so it is washed of colour, darkened and tinted with the
       * site's blue, and shaded towards the edges. It fades in once it really plays; until then, or
       * if a phone refuses to play it, the plain background of the theme stays.
       */
      .sp-video,
      .sp-tint,
      .sp-shade {
        position: absolute;
        inset: 0;
      }
      .sp-video {
        /* A little oversized: the blur would otherwise show soft edges. */
        inset: -3%;
        width: 106%;
        height: 106%;
        object-fit: cover;
        filter: var(--sp-video);
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }
      .sp-video.is-on {
        opacity: 1;
      }
      .sp-tint {
        background: var(--sp-tint);
        mix-blend-mode: multiply;
      }
      .sp-shade {
        background: var(--sp-shade);
      }

      .sp-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        text-align: center;
        color: var(--sp-ink);
        transition: transform 0.55s cubic-bezier(0.5, 0, 0.9, 0.4), opacity 0.4s ease-in 0.12s, filter 0.5s ease-in;
      }
      .sp-cap {
        width: 124px;
        height: 124px;
        overflow: visible;
        animation: sp-cap-in 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) both, sp-cap-float 3.4s ease-in-out 0.9s infinite;
        filter: drop-shadow(0 10px 26px rgba(30, 100, 240, 0.4));
      }
      .sp-cap-empty {
        fill: var(--sp-empty);
      }
      .sp-cap-line {
        fill: none;
        stroke: var(--sp-line);
        stroke-width: 0.3;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: sp-draw 1.1s ease-out 0.1s forwards;
      }
      /* The liquid rises through the whole height of the cap while the site is on its way. */
      .sp-rise {
        animation: sp-rise 2.2s cubic-bezier(0.4, 0, 0.3, 1) 0.3s both;
      }
      .sp-liquid-a {
        fill: var(--sp-liquid-a);
        opacity: 0.6;
        animation: sp-slosh 1.5s linear infinite;
      }
      .sp-liquid-b {
        fill: var(--sp-liquid-b);
        animation: sp-slosh 2.3s linear infinite reverse;
      }
      .sp-bubble {
        fill: var(--sp-shine);
        opacity: 0;
        animation: sp-bubble 1.5s ease-in infinite;
      }
      .sp-bubble:nth-of-type(2) { animation-delay: 0.5s; }
      .sp-bubble:nth-of-type(3) { animation-delay: 1s; }
      @keyframes sp-cap-in {
        from { transform: scale(0.4) rotate(-14deg); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @keyframes sp-cap-float {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-7px) rotate(-2deg); }
      }
      @keyframes sp-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes sp-rise {
        from { transform: translateY(19px); }
        to { transform: translateY(0); }
      }
      @keyframes sp-slosh {
        to { transform: translateX(12px); }
      }
      @keyframes sp-bubble {
        0% { transform: translateY(5px) scale(0.5); opacity: 0; }
        25% { opacity: 0.85; }
        100% { transform: translateY(-5px) scale(1); opacity: 0; }
      }
      .sp-title {
        margin: 22px 0 0;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.025em;
      }
      .sp-sub {
        margin: 8px 0 0;
        min-height: 1.4em;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--sp-ink-2);
      }
      .sp-ch {
        display: inline-block;
        white-space: pre;
        animation: sp-ch 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--d) * 1s);
      }
      @keyframes sp-ch {
        from { transform: translateY(0.55em) scale(0.9); opacity: 0; filter: blur(9px); }
        to { transform: none; opacity: 1; filter: blur(0); }
      }

      /* Leaving: the cap and the words fly past the viewer, and the site pulls back from behind them. */
      #splash.is-leaving { pointer-events: none; }
      #splash.is-leaving .sp-world { opacity: 0; }
      #splash.is-leaving .sp-center {
        transform: scale(5);
        opacity: 0;
        filter: blur(14px);
      }

      @media (prefers-reduced-motion: reduce) {
        .sp-cap, .sp-liquid-a, .sp-liquid-b, .sp-bubble, .sp-ch { animation: none; }
        .sp-cap-line { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Загрузка">
      <div class="sp-world" aria-hidden="true">
        <!-- From 0.3 s: the very first frames of the file have black bars at the sides. -->
        <video class="sp-video" src="./splash.mp4#t=0.3" muted loop playsinline preload="auto"></video>
        <div class="sp-tint"></div>
        <div class="sp-shade"></div>
      </div>
      <div class="sp-center">
        <svg class="sp-cap" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <!-- The same outline as src/web/capPath.ts. -->

            <clipPath id="sp-cap-clip"><use href="#sp-outline" /></clipPath>
          </defs>
          <use href="#sp-outline" class="sp-cap-empty" />
          <g clip-path="url(#sp-cap-clip)">
            <g class="sp-rise">
              <path class="sp-liquid-a" d="M-24 2.4q3-1.5 6 0t6 0 6 0 6 0 6 0 6 0 6 0 6 0V30H-24Z" />
              <path class="sp-liquid-b" d="M-24 3.2q3 1.3 6 0t6 0 6 0 6 0 6 0 6 0 6 0 6 0V30H-24Z" />
              <circle class="sp-bubble" cx="9" cy="12" r="0.55" />
              <circle class="sp-bubble" cx="14" cy="10" r="0.4" />
              <circle class="sp-bubble" cx="17.5" cy="13" r="0.5" />
            </g>
          </g>
          <use href="#sp-outline" class="sp-cap-line" />
        </svg>
        <h1 class="sp-title" data-letters="0.45">Мой план</h1>
        <p class="sp-sub" data-letters="0.85"></p>
      </div>
    </div>
    <script>
      // A new line on every load, and both lines write themselves in letter by letter.
      (function () {
        var video = document.querySelector('.sp-video');
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          video.addEventListener('playing', function () { video.classList.add('is-on'); });
          var played = video.play();
          // Low-power mode can refuse: the plain background then stays, which is fine.
          if (played) played.catch(function () {});
        }

        var lines = [
          'Наливаем планы до краёв',
          'Поправляем козырёк',
          'Раскладываем день по полочкам',
          'Пересчитываем деньги, пока никто не видит',
          'Вспоминаем, что ты хотел сделать',
          'Ещё секунду, завязываем шнурки',
        ];
        document.querySelector('.sp-sub').textContent = lines[Math.floor(Math.random() * lines.length)];
        document.querySelectorAll('[data-letters]').forEach(function (el) {
          var start = parseFloat(el.dataset.letters);
          var text = el.textContent;
          el.setAttribute('aria-label', text);
          el.textContent = '';
          Array.from(text).forEach(function (c, i) {
            var s = document.createElement('span');
            s.className = 'sp-ch';
            s.setAttribute('aria-hidden', 'true');
            s.style.setProperty('--d', (start + i * (text.length > 12 ? 0.018 : 0.045)).toFixed(3));
            s.textContent = c;
            el.appendChild(s);
          });
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
